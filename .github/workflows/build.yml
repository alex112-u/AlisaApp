name: Crear APK de Alisa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          python -m pip install --upgrade pip
          pip install buildozer setuptools "cython==0.29.34"

      - name: Instalar herramientas Android
  run: |
    yes | buildozer android update || true
    yes | sdkmanager "build-tools;35.0.0" "platform-tools" "platforms;android-35" "aidl;1"

- name: Compilar APK
  run: buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Alisa-APK
          path: bin/*.apk

          
